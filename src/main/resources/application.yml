spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:sme-stocksense-backend/.env[.properties]
  application:
    name: sme-stocksense-backend

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

app:
  jwt:
    # Local fallback only. Set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-change-me-dev-only-change-me-dev-only-change-me}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:86400}
