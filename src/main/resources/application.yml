spring:
  application:
    name: sme-stocksense-backend
  profiles:
    active: neon
  config:
    import: optional:classpath:.env[.properties]

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  env: ${CLOUDINARY_ENV:dev}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

app:
  import-receipt:
    # Ngưỡng tổng tiền để bắt buộc 2 cấp duyệt (mặc định 50.000.000đ)
    second-approval-threshold-amount: 50000000
