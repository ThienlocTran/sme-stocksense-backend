# English translation for SME StockSense Backend
# Note: Escape spaces in keys with \

# Validation Messages
Tên\ sản\ phẩm\ không\ được\ để\ trống. = Product name cannot be blank.
Mã\ sản\ phẩm\ không\ được\ để\ trống. = Product code cannot be blank.
Đơn\ vị\ tính\ không\ được\ để\ trống. = Unit of measure cannot be blank.
Giá\ tiền\ không\ được\ để\ trống. = Price cannot be blank.
Giá\ tiền\ phải\ lớn\ hơn\ hoặc\ bằng\ 0. = Price must be greater than or equal to 0.
Ngưỡng\ tồn\ phải\ lớn\ hơn\ hoặc\ bằng\ 0. = Minimum stock must be greater than or equal to 0.
Mã\ kho\ không\ được\ để\ trống. = Warehouse code cannot be blank.
Tên\ kho\ không\ được\ để\ trống. = Warehouse name cannot be blank.
Mã\ kho\ đã\ tồn\ tại. = Warehouse code already exists.
Tên\ đối\ tác\ không\ được\ để\ trống. = Partner name cannot be blank.
Loại\ đối\ tác\ không\ được\ để\ trống. = Partner type cannot be blank.
Trạng\ thái\ không\ được\ để\ trống. = Status cannot be blank.
Mã\ đối\ tác\ đã\ tồn\ tại. = Partner code already exists.
Trạng\ thái\ chỉ\ nhận\ HOAT_DONG\ hoặc\ NGUNG_HOAT_DONG. = Status must be HOAT_DONG or NGUNG_HOAT_DONG.
Lỗi\ hệ\ thống.\ Vui\ lòng\ thử\ lại\ sau. = System error. Please try again later.
Dữ\ liệu\ không\ hợp\ lệ. = Invalid data.
JSON\ không\ hợp\ lệ\ hoặc\ request\ body\ bị\ thiếu. = Invalid JSON or request body is missing.
Tên\ danh\ mục\ không\ được\ để\ trống. = Category name cannot be blank.
Mã\ danh\ mục\ đã\ tồn\ tại. = Category code already exists.
Lý\ do\ từ\ chối\ không\ được\ để\ trống. = Rejection reason cannot be blank.
Lý\ do\ từ\ chối\ không\ được\ vượt\ quá\ 500\ ký\ tự. = Rejection reason must not exceed 500 characters.

# Business Exceptions & Custom Messages
Đồng\ kiểm\ kê\ đã\ được\ cập\ nhật. = Inventory audit line has been updated.
Phải\ nhập\ số\ lượng\ thực\ tế\ cho\ tất\ cả\ sản\ phẩm. = Must enter actual quantity for all products.
Đợt\ kiểm\ kê\ đã\ chốt\ hoặc\ đã\ hủy. = Inventory audit has been finalized or cancelled.
Đợt\ kiểm\ kê\ đã\ được\ cập\ nhật. = Inventory audit has been updated.
Trạng\ thái\ kiểm\ kê\ không\ hợp\ lệ. = Invalid inventory audit status.
Không\ xác\ định\ được\ người\ dùng. = Cannot identify current user.
productId,\ warehouseId,\ quantity\ phải\ >\ 0 = productId, warehouseId, quantity must be > 0.
Chỉ\ cập\ nhật\ tồn\ kho\ khi\ phiếu\ nhập\ đã\ COMPLETED. = Only update stock when import receipt is COMPLETED.
Tổng\ số\ lượng\ tồn\ kho\ vượt\ giới\ hạn\ cho\ phép. = Total inventory exceeds maximum limit.
Kho\ hàng\ không\ tồn\ tại. = Warehouse does not exist.
Sản\ phẩm\ không\ tồn\ tại. = Product does not exist.
Trạng\ thái\ tồn\ kho\ không\ hợp\ lệ: = Invalid stock status:
Trạng\ thái\ hoạt\ động\ không\ hợp\ lệ: = Invalid active status:
ID\ sản\ phẩm\ không\ hợp\ lệ. = Invalid product ID.
ID\ kho\ không\ hợp\ lệ. = Invalid warehouse ID.
Loại\ giao\ dịch\ kho\ không\ được\ để\ trống. = Warehouse transaction type cannot be empty.
Số\ lượng\ giao\ dịch\ phải\ lớn\ hơn\ 0. = Transaction quantity must be greater than 0.
Số\ lượng\ trước/sau\ không\ được\ để\ trống. = Quantity before/after cannot be empty.
Số\ lượng\ sau\ không\ khớp\ với\ số\ lượng\ trước\ và\ số\ lượng\ thay\ đổi. = Quantity after does not match quantity before and delta.
Mã\ đối\ tác\ đã\ tồn\ tại. = Partner code already exists.
Loại\ đối\ tác\ không\ được\ để\ trống. = Partner type cannot be empty.
Trạng\ thái\ không\ được\ để\ trống. = Status cannot be empty.
status\ không\ hợp\ lệ. = status is invalid.
Loại\ đối\ tác\ không\ hợp\ lệ.\ Chỉ\ nhận\ NHA_CUNG_CAP,\ KHACH_HANG\ hoặc\ CA_HAI. = Invalid partner type. Only NHA_CUNG_CAP, KHACH_HANG, or CA_HAI is accepted.
Trạng\ thái\ không\ hợp\ lệ.\ Chỉ\ nhận\ HOAT_DONG\ hoặc\ NGUNG_HOAT_DONG. = Invalid status. Only HOAT_DONG or NGUNG_HOAT_DONG is accepted.
status\ không\ hợp\ lệ.\ Chỉ\ nhận\ HOAT_DONG\ hoặc\ NGUNG_HOAT_DONG. = Invalid status. Only HOAT_DONG or NGUNG_HOAT_DONG is accepted.
Trạng\ thái\ chỉ\ nhận\ HOAT_DONG\ hoặc\ NGUNG_HOAT_DONG. = Status must be HOAT_DONG or NGUNG_HOAT_DONG.
Không\ thể\ tạo\ file\ PDF. = Cannot generate PDF file.
Không\ thể\ tạo\ file\ Excel. = Cannot generate Excel file.
Mã\ kho\ đã\ tồn\ tại. = Warehouse code already exists.
Trạng\ thái\ chỉ\ nhận\ HOAT_DONG\ hoặc\ NGUNG_HOAT_DONG. = Status must be HOAT_DONG or NGUNG_HOAT_DONG.
status\ không\ hợp\ lệ. = Invalid status.
Tài\ khoản\ không\ hoạt\ động. = Account is inactive.
Tài\ khoản\ hoặc\ mật\ khẩu\ không\ chính\ xác. = Incorrect email or password.
Mật\ khẩu\ hiện\ tại\ không\ chính\ xác. = Current password is incorrect.
Không\ thể\ đổi\ mật\ khẩu. = Cannot change password.
Đổi\ mật\ khẩu\ thành\ công. = Password changed successfully.

# Auth
Mật\ khẩu\ mới\ phải\ khác\ mật\ khẩu\ hiện\ tại. = New password must be different from current password.
Mật\ khẩu\ xác\ nhận\ không\ khớp. = Password confirmation does not match.
Vui\ lòng\ nhập\ mật\ khẩu\ hiện\ tại. = Please enter current password.
Vui\ lòng\ nhập\ mật\ khẩu\ mới. = Please enter new password.
Mật\ khẩu\ mới\ tối\ thiểu\ 8\ ký\ tự. = New password must be at least 8 characters.
Vui\ lòng\ xác\ nhận\ mật\ khẩu\ mới. = Please confirm new password.
