spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  application:
    name: sme-stocksense-backend
  profiles:
    active: neon
  config:
    import:
      - optional:file:sme-stocksense-backend/.env[.properties]
      - optional:file:.env[.properties]
      - optional:classpath:.env[.properties]

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  env: ${CLOUDINARY_ENV:dev}

ai-service:
  base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
  timeout-seconds: ${AI_SERVICE_TIMEOUT_SECONDS:30}

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  import-receipt:
    # Ngưỡng tổng tiền để bắt buộc 2 cấp duyệt (mặc định 50.000.000đ)
    second-approval-threshold-amount: 50000000
